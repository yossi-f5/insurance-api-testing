version: 1.0
runtime: nodejs22           # Change from nodejs18 to nodejs22
build:
  commands:
    build:                  # Note: 'build' is required under build: commands
      - npm ci --omit=dev
run:
  runtime-version: 22       # Match the runtime version (optional but recommended)
  command: npm start
  network:
    port: 3001
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3001"
