version: 1.0
runtime: nodejs22
build:
  commands:
    pre-build:
      - npm ci --omit=dev
run:
  runtime-version: 22
  command: npm start
  network:
    port: 3001
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3001"
  health-check:
    path: /api/health
    interval: 10
    timeout: 5
    healthy-threshold: 1
    unhealthy-threshold: 5
